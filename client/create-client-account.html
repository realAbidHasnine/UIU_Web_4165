<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set up your Client Account - SkillMatch</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="topbar"><div class="topbar-inner">
<a class="brand" href="client-dashboard.html">SkillMatch</a>
<nav class="nav" style="justify-content:center"><a class="active" href="create-client-account.html" style="border:0">Account Details</a></nav>
<div class="top-actions"></div>
</div></header>
<main class="container"><div class="account-card">
<h2 style="margin:0">Set up your Client Account</h2><p class="page-sub" style="margin:4px 0 18px">Tell us a bit about yourself to get started.</p>
<div style="text-align:center;margin-bottom:18px"><div class="photo-upload"><span class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span><span style="background:var(--primary);color:#fff;font-size:12px;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;margin-left:-18px;margin-top:40px;border:2px solid #fff">+</span></div><div style="font-size:11px;font-weight:600;margin-top:8px">Upload profile photo</div></div>
<form action="client-dashboard.html" method="get">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:16px"><div class="field" style="margin:0"><label>First Name</label><input class="input" placeholder="Enter first name" style="border-radius:3px 0 0 3px"></div><div class="field" style="margin:0"><label>Last Name</label><input class="input" placeholder="Enter last name" style="border-radius:0 3px 3px 0;border-left:0"></div></div>
<div class="field"><label>Company Name</label><input class="input" placeholder="e.g., Kolpolok"></div>
<div class="field"><label>Work Email</label><input class="input" placeholder="name@company.com"></div>
<div class="field"><label>Password</label><input class="input" type="password" value="********"></div>
<div class="field"><label>Describe your primary hiring needs</label><textarea class="textarea" placeholder="e.g., web development, manual labor, digital services"></textarea></div>
<button class="btn btn-primary" style="width:100%" type="submit">Continue</button>
<p style="color:#94a3b8;font-size:12.5px;text-align:center;margin:14px 0 0">By clicking continue, you agree to our Terms of Service and Privacy Policy.</p>
</form></div></main></body></html>
