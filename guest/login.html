<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SkillMatch</title>
  <link rel="stylesheet" href="assets/css/guest-global.css">
</head>
<body class="page-login">

  <!-- Top Right Admin Login -->
  <a href="admin_login.html" class="btn-admin">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="14" height="14">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
    </svg>
    Admin Login
  </a>

  <!-- Login Modal -->
  <div class="modal">
    <!-- Close Icon -->
    <a href="landing.html" class="modal__close" aria-label="Close dialog">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </a>

    <h2 class="modal__title">Welcome Back</h2>

    <form id="loginForm" action="login.html" method="POST">
      <!-- Email -->
      <div class="form-group">
        <div class="form-label-row">
          <label for="email" class="form-label">Email Address</label>
        </div>
        <input type="email" id="email" name="email" class="form-input" placeholder="name@company.com" required autocomplete="email">
      </div>

      <!-- Password -->
      <div class="form-group" style="margin-bottom: var(--spacing-lg);">
        <div class="form-label-row">
          <label for="password" class="form-label">Password</label>
          <a href="#forgot" class="form-link" onclick="alert('Password reset link has been dispatched if account exists.')">Forgot password?</a>
        </div>
        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <!-- Login Actions -->
      <button type="submit" name="user_role" value="client" class="btn btn--solid btn--block" style="padding: 11px; margin-bottom: 8px;">Log In as Client</button>
      <button type="submit" name="user_role" value="freelancer" class="btn btn--outline btn--block" style="padding: 11px; margin-bottom: 12px;">Log In as Freelancer</button>

      <!-- OR Divider -->
      <div class="divider">OR</div>

      <!-- Google Sign In -->
      <button type="button" class="btn btn--google" onclick="alert('Google SSO authentication initialized.')">
        <svg viewBox="0 0 24 24" width="18" height="18" style="width: 18px; height: 18px; min-width: 18px; max-width: 18px;">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          <path d="M1 1h22v22H1z" fill="none"/>
        </svg>
        Continue with Google
      </button>

      <!-- Footer -->
      <p class="modal__footer">
        New here? <a href="sign_in.html" class="form-link">Sign up</a>
      </p>
    </form>
  </div>

</body>
</html>
