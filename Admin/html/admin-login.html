<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillMatch â€” Admin Login</title>
  <link rel="stylesheet" href="../css/admin-login.css">
  <link rel="stylesheet" href="../../assets/css/global.css">
</head>

<body>

  <div class="login-wrapper">
    <div class="brand-name">SkillMatch</div>
    <span class="admin-badge">Admin</span>
    <p class="login-subtitle">Log in to the admin console.</p>

    <div class="login-card">
      <!-- TODO: replace with PHP session-based auth: $_SESSION['role']='admin'; then redirect() -->
      <form id="adminLoginForm" method="POST" action="../../guest/admin-login.php">
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input class="form-input" type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="login-btn" name="admin_login_submit" value="1">Log In</button>
      </form>
    </div>

    <p class="login-footnote">Admin access only. Contact IT if you've lost your credentials.</p>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
</body>

</html>
