    /* Active Card & Dynamic Styles */
    .job-card {
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
    }
    .job-card:hover {
      border-color: var(--color-primary);
      transform: translateY(-2px);
    }
    .job-card--active {
      border-color: var(--color-primary) !important;
      box-shadow: 0 0 0 1px var(--color-primary), var(--shadow-sm) !important;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- 3-Column Layout -->
  <main class="main main--wide job-listing-layout">
    
    <!-- Column 1: Filters -->
    <aside class="filters-sidebar">
      <form id="filtersForm">
        <div class="filters__header">
          <span>Filters</span>
          <button type="reset" class="filters__reset-btn" id="resetFilters">Reset</button>
        </div>
        
        <!-- Category -->
        <div class="filter-group">
          <div class="filter-group__title">Category</div>
          <label class="checkbox-item">
            <input type="checkbox" id="cat-web" name="category" value="web" class="checkbox-item__input filter-category" checked>
            <span class="checkbox-item__label">Web Development</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="cat-uiux" name="category" value="uiux" class="checkbox-item__input filter-category" checked>
            <span class="checkbox-item__label">UI/UX Design</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="cat-mobile" name="category" value="mobile" class="checkbox-item__input filter-category" checked>
            <span class="checkbox-item__label">Mobile Apps</span>
          </label>
        </div>

        <!-- Budget Range -->
        <div class="filter-group">
          <div class="filter-group__title">Budget Range</div>
          <select name="budget_range" id="filterBudget" class="select-input">
            <option value="any">Any Budget</option>
            <option value="under-1000">Under $1,000</option>
            <option value="1000-3000">$1,000 – $3,000</option>
            <option value="3000-5000">$3,000 – $5,000</option>
            <option value="5000-plus">$5,000+</option>
          </select>
        </div>

        <!-- Project Length -->
        <div class="filter-group">
          <div class="filter-group__title">Project Length</div>
          <select name="project_length" id="filterLength" class="select-input">
            <option value="any">Any Duration</option>
            <option value="less-1-month">Less than 1 month</option>
            <option value="1-3-months">1 to 3 months</option>
            <option value="more-3-months">3+ months</option>
          </select>
        </div>
      </form>
    </aside>

    <!-- Column 2: Job List Feed (Dynamically Rendered via API) -->
    <section class="job-list" id="jobFeed">
      <!-- Dynamic Job Cards rendered by job-listing.js -->
    </section>

    <!-- Column 3: Job Details & Proposal Sidebar -->
    <aside class="job-details-sidebar" id="detailsSidebar">
      <!-- Dynamic Details Container -->
      <div id="jobDetailsContent">
        <!-- Dynamically populated by job-listing.js -->
      </div>

      <!-- Submit Proposal Form -->
      <form id="jobProposalForm" class="proposal-form">
        <h2 class="proposal-form__title">Submit Proposal</h2>
        
        <div class="form-group">
          <label class="form-group__label" for="coverLetter">Cover Letter</label>
          <textarea id="coverLetter" name="cover_letter" class="form-input form-input--textarea" placeholder="Highlight your relevant experience and how you will solve the client's needs..." required></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-group__label" for="proposedRate">Proposed Rate ($)</label>
            <input type="number" id="proposedRate" name="proposed_rate" class="form-input" placeholder="e.g. 4200" required>
          </div>
          <div class="form-group">
            <label class="form-group__label" for="estimatedDuration">Estimated Duration</label>
            <select id="estimatedDuration" name="estimated_duration" class="form-input select-input" required>
              <option value="less-1-month">Less than 1 month</option>
              <option value="1-3-months" selected>1-3 months</option>
              <option value="more-3-months">3+ months</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn btn--solid btn-submit">Submit Proposal</button>
      </form>
    </aside>

  </main>
