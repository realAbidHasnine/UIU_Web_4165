  <!-- Main Profile Content -->
  <main class="main profile-container">
    <div class="profile-card">
      <div class="card__header">
        <h1 class="card__heading">Freelancer Profile & Settings</h1>
        <p class="card__subtext">Update your professional bio, public contact details, and specialized skills.</p>
      </div>

      <div class="card__body">
        
        <!-- Interactive Photo Upload -->
        <div class="photo-upload">
          <label for="avatarFileInput" class="photo-upload__preview" id="photoPreviewContainer" title="Click to upload profile photo" style="cursor: pointer;">
            <svg id="defaultAvatarSvg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            <img id="avatarImage" src="" alt="Profile preview" style="display: none;">
          </label>
          <input type="file" id="avatarFileInput" accept="image/*" class="photo-upload__input" style="display: none;">
          <label for="avatarFileInput" class="photo-upload__btn" id="btnUploadPhoto" role="button" tabindex="0" style="cursor: pointer; display: inline-block; text-align: center;">Change Profile Photo</label>
        </div>

        <!-- Profile Form -->
        <form id="profileEditForm">
          <div class="form-group">
            <label class="form-group__label" for="fullName">Full Name</label>
            <input type="text" id="fullName" name="full_name" class="form-input" placeholder="Your Full Name" required>
          </div>

          <div class="form-group">
            <label class="form-group__label" for="email">Professional Email</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="name@domain.com" required>
          </div>

          <div class="form-group">
            <label class="form-group__label" for="bio">Professional Bio</label>
            <textarea id="bio" name="bio" class="form-input form-input--textarea" placeholder="Describe your background and expertise..." required></textarea>
          </div>

          <div class="form-group">
            <label class="form-group__label" for="skills">Skills & Expertise (Comma-separated)</label>
            <input type="text" id="skills" name="skills" class="form-input" placeholder="e.g. React, TypeScript, Spring Boot" required>
          </div>

          <div style="display: flex; gap: 12px; margin-top: 24px;">
            <a href="index.html" class="btn btn--secondary" style="flex: 1; text-align: center; text-decoration: none;">Cancel</a>
            <button type="submit" class="btn btn--solid" style="flex: 2;">Save Profile Changes</button>
          </div>
        </form>

      </div>
    </div>
  </main>
