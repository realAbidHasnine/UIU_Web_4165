  <!-- Main Content -->
  <main class="main main--wide">
    <div class="chat-layout">
      
      <!-- Inbox Sidebar -->
      <aside class="inbox">
        <div class="inbox__header">
          <span>Client Messages</span>
          <span class="unread-badge" id="totalUnread" style="display:none;">0</span>
        </div>
        <!-- Dynamic Inbox Threads List -->
        <div class="inbox__list" id="inboxList">
          <!-- Populated by chat.js -->
        </div>
      </aside>

      <!-- Active Chat Window -->
      <section class="chat">
        
        <!-- Chat Header -->
        <header class="chat__header">
          <div class="chat__header-info">
            <h2 class="chat__header-name" id="chatHeaderName">Select a Conversation</h2>
            <span class="badge-client" id="chatHeaderBadge">Client</span>
          </div>
          <a href="upload_comp_work.html" class="chat__header-link" id="chatHeaderProjectLink">View Project Deliverable &rarr;</a>
        </header>

        <!-- Dynamic Chat Messages Area -->
        <div class="chat__messages" id="chatMessages">
          <!-- Populated by chat.js -->
        </div>

        <!-- Chat Input Form -->
        <form id="chatInputForm" class="chat__input-area">
          <input type="text" id="messageInput" name="message" class="chat__input" placeholder="Type a message..." autocomplete="off" required>
          <button type="submit" class="chat__btn">Send</button>
        </form>

      </section>

    </div>
  </main>
